<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星耀影视 - Premium Entertainment</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg-primary: #0d0d1a;
  --bg-secondary: #131326;
  --bg-sidebar: #0a0a18;
  --bg-card: #1a1a2e;
  --bg-card-hover: #1f1f38;
  --bg-input: #12122a;
  --accent-gold: #f0c040;
  --accent-gold-dark: #d4a830;
  --accent-orange: #e67e22;
  --accent-gradient: linear-gradient(135deg, #f0c040, #e67e22);
  --text-primary: #ffffff;
  --text-secondary: #8888aa;
  --text-muted: #555570;
  --border-color: rgba(255,255,255,0.06);
  --border-gold: rgba(240,192,64,0.3);
  --sidebar-width: 220px;
  --radius: 12px;
  --radius-sm: 8px;
  --radius-lg: 16px;
  --shadow-card: 0 4px 24px rgba(0,0,0,0.3);
  --shadow-glow: 0 0 20px rgba(240,192,64,0.15);
  --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  display: flex;
  overflow-x: hidden;
}
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(240,192,64,0.2); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(240,192,64,0.4); }

/* ===== Sidebar ===== */
.sidebar {
  width: var(--sidebar-width);
  min-height: 100vh;
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border-color);
  display: flex;
  flex-direction: column;
  position: fixed;
  left: 0; top: 0; bottom: 0;
  z-index: 100;
  overflow-y: auto;
}
.sidebar-logo {
  padding: 24px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid var(--border-color);
}
.sidebar-logo .logo-icon {
  width: 40px; height: 40px;
  background: var(--accent-gradient);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; color: #0a0a18;
  box-shadow: var(--shadow-glow);
}
.sidebar-logo .logo-text {
  font-size: 18px; font-weight: 700;
  background: var(--accent-gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.sidebar-logo .logo-sub {
  font-size: 10px; color: var(--text-muted);
  letter-spacing: 2px; text-transform: uppercase;
  margin-top: 2px;
}
.sidebar-nav { flex: 1; padding: 16px 0; }
.nav-section-label {
  font-size: 10px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  padding: 12px 24px 8px;
  font-weight: 600;
}
.nav-item {
  display: flex; align-items: center; gap: 14px;
  padding: 12px 24px;
  cursor: pointer;
  transition: var(--transition);
  color: var(--text-secondary);
  font-size: 14px; font-weight: 500;
  position: relative;
}
.nav-item:hover { color: var(--text-primary); background: rgba(240,192,64,0.05); }
.nav-item.active { color: var(--accent-gold); background: rgba(240,192,64,0.08); }
.nav-item.active::before {
  content: '';
  position: absolute;
  left: 0; top: 50%; transform: translateY(-50%);
  width: 3px; height: 24px;
  background: var(--accent-gradient);
  border-radius: 0 3px 3px 0;
}
.nav-item i { width: 20px; text-align: center; font-size: 16px; }
.nav-item .badge {
  margin-left: auto;
  background: var(--accent-orange);
  color: white;
  font-size: 10px; font-weight: 700;
  padding: 2px 7px;
  border-radius: 10px;
}
.sidebar-footer {
  padding: 16px 20px;
  border-top: 1px solid var(--border-color);
}
.sidebar-user {
  display: flex; align-items: center; gap: 12px;
  padding: 10px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: var(--transition);
}
.sidebar-user:hover { background: rgba(255,255,255,0.03); }
.sidebar-user-avatar {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: var(--accent-gradient);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 14px; color: #0a0a18;
}
.sidebar-user-name { font-size: 13px; font-weight: 600; }
.sidebar-user-id { font-size: 11px; color: var(--text-muted); }

/* ===== Main Content ===== */
.main-content { flex: 1; margin-left: var(--sidebar-width); min-height: 100vh; }

/* Top Bar */
.topbar {
  height: 60px;
  background: rgba(13,13,26,0.8);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border-color);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 32px;
  position: sticky; top: 0; z-index: 50;
}
.topbar-search {
  display: flex; align-items: center; gap: 8px;
  background: var(--bg-input);
  border: 1px solid var(--border-color);
  border-radius: 10px;
  padding: 8px 16px;
  min-width: 320px;
}
.topbar-search i { color: var(--text-muted); font-size: 14px; }
.topbar-search input {
  background: none; border: none; outline: none;
  color: var(--text-primary);
  font-size: 13px; width: 100%;
  font-family: inherit;
}
.topbar-search input::placeholder { color: var(--text-muted); }
.topbar-right { display: flex; align-items: center; gap: 20px; }
.topbar-icon {
  width: 36px; height: 36px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  color: var(--text-secondary);
  transition: var(--transition);
  position: relative;
}
.topbar-icon:hover { color: var(--text-primary); background: rgba(255,255,255,0.05); }
.topbar-icon .dot {
  position: absolute; top: 6px; right: 6px;
  width: 8px; height: 8px;
  background: var(--accent-orange);
  border-radius: 50%;
  border: 2px solid var(--bg-primary);
}

/* Page Content */
.page-content { padding: 32px; max-width: 1400px; }
.page-section { display: none; }
.page-section.active { display: block; animation: fadeIn 0.4s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* Page Header */
.page-header { margin-bottom: 28px; }
.page-header h1 { font-size: 26px; font-weight: 700; margin-bottom: 6px; }
.page-header p { color: var(--text-secondary); font-size: 14px; }

/* Section Title */
.section-title {
  font-size: 18px; font-weight: 700;
  margin-bottom: 18px;
  display: flex; align-items: center; gap: 10px;
}
.section-title .line { flex: 1; height: 1px; background: var(--border-color); }
.section-title .more { font-size: 12px; color: var(--text-muted); cursor: pointer; font-weight: 400; }
.section-title .more:hover { color: var(--accent-gold); }

/* ===== BANNER ===== */
.banner-container {
  position: relative;
  border-radius: var(--radius-lg);
  overflow: hidden;
  margin-bottom: 32px;
  aspect-ratio: 21/7;
}
.banner-slides { display: flex; width: 300%; height: 100%; transition: transform 0.6s ease; }
.banner-slide {
  width: calc(100%/3); height: 100%;
  display: flex; align-items: center;
  padding: 0 60px;
  position: relative; overflow: hidden;
}
.banner-slide:nth-child(1) { background: linear-gradient(135deg, #1a1a2e 0%, #0f3460 50%, #16213e 100%); }
.banner-slide:nth-child(2) { background: linear-gradient(135deg, #2a1a3e 0%, #0f2860 50%, #162140 100%); }
.banner-slide:nth-child(3) { background: linear-gradient(135deg, #1a2a1e 0%, #0f4430 50%, #16303e 100%); }
.banner-slide::before {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(90deg, rgba(10,10,24,0.95) 0%, rgba(10,10,24,0.5) 50%, rgba(10,10,24,0.2) 100%);
}
.banner-content { position: relative; z-index: 2; max-width: 500px; }
.banner-tag {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--accent-gradient);
  color: #0a0a18;
  font-size: 11px; font-weight: 700;
  padding: 4px 12px; border-radius: 20px;
  margin-bottom: 16px;
  text-transform: uppercase; letter-spacing: 0.5px;
}
.banner-content h2 { font-size: 30px; font-weight: 800; line-height: 1.2; margin-bottom: 12px; }
.banner-content p { color: var(--text-secondary); font-size: 14px; line-height: 1.6; margin-bottom: 24px; }
.banner-btn {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--accent-gradient);
  color: #0a0a18;
  padding: 12px 28px;
  border-radius: 10px;
  font-weight: 700; font-size: 14px;
  border: none; cursor: pointer;
  transition: var(--transition);
  box-shadow: 0 4px 20px rgba(240,192,64,0.3);
  font-family: inherit;
}
.banner-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 30px rgba(240,192,64,0.4); }
.banner-img {
  position: absolute; right: 60px; top: 50%; transform: translateY(-50%);
  width: 200px; height: 280px;
  border-radius: var(--radius);
  object-fit: cover;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  z-index: 1;
}
.banner-dots {
  position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 8px; z-index: 5;
}
.banner-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: rgba(255,255,255,0.2);
  cursor: pointer; transition: var(--transition);
}
.banner-dot.active { width: 28px; border-radius: 4px; background: var(--accent-gold); }

/* ===== Category Tags ===== */
.category-tags { display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; }
.cat-tag {
  padding: 8px 20px; border-radius: 20px;
  font-size: 13px; font-weight: 500; cursor: pointer;
  transition: var(--transition);
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  color: var(--text-secondary);
}
.cat-tag:hover { border-color: var(--border-gold); color: var(--text-primary); }
.cat-tag.active { background: var(--accent-gradient); color: #0a0a18; border-color: transparent; font-weight: 600; }

/* ===== Movie Card Grid ===== */
.movie-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 36px; }
.movie-card {
  background: var(--bg-card);
  border-radius: var(--radius);
  overflow: hidden; cursor: pointer;
  transition: var(--transition);
  border: 1px solid var(--border-color);
}
.movie-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-card); border-color: var(--border-gold); }
.movie-card-img { aspect-ratio: 2/3; position: relative; overflow: hidden; }
.movie-card-img img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
.movie-card:hover .movie-card-img img { transform: scale(1.05); }
.movie-card-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(10,10,24,0.9) 0%, transparent 50%);
  opacity: 0; transition: opacity 0.3s;
  display: flex; align-items: center; justify-content: center;
}
.movie-card:hover .movie-card-overlay { opacity: 1; }
.play-btn {
  width: 48px; height: 48px; border-radius: 50%;
  background: rgba(240,192,64,0.9);
  display: flex; align-items: center; justify-content: center;
  color: #0a0a18; font-size: 18px;
  transform: scale(0.8); transition: transform 0.3s;
}
.movie-card:hover .play-btn { transform: scale(1); }
.movie-card-rating {
  position: absolute; top: 10px; left: 10px;
  background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
  padding: 4px 10px; border-radius: 6px;
  font-size: 12px; font-weight: 700; color: var(--accent-gold);
  display: flex; align-items: center; gap: 4px;
}
.movie-card-tag {
  position: absolute; top: 10px; right: 10px;
  background: var(--accent-orange); color: white;
  padding: 3px 8px; border-radius: 4px;
  font-size: 10px; font-weight: 700; text-transform: uppercase;
}
.movie-card-info { padding: 14px; }
.movie-card-title { font-size: 14px; font-weight: 600; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.movie-card-meta { font-size: 11px; color: var(--text-muted); display: flex; gap: 8px; }

/* ===== Tab Component ===== */
.tabs {
  display: flex; gap: 4px;
  background: var(--bg-card);
  padding: 4px; border-radius: 12px;
  margin-bottom: 24px; width: fit-content;
}
.tab-item {
  padding: 10px 24px; border-radius: 10px;
  font-size: 13px; font-weight: 500; cursor: pointer;
  transition: var(--transition);
  color: var(--text-secondary);
}
.tab-item:hover { color: var(--text-primary); }
.tab-item.active { background: var(--accent-gradient); color: #0a0a18; font-weight: 600; }

/* ===== Video Grid ===== */
.video-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.video-card {
  background: var(--bg-card);
  border-radius: var(--radius);
  overflow: hidden; cursor: pointer;
  transition: var(--transition);
  border: 1px solid var(--border-color);
}
.video-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-card); }
.video-card-thumb { aspect-ratio: 16/9; position: relative; overflow: hidden; }
.video-card-thumb img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
.video-card:hover .video-card-thumb img { transform: scale(1.05); }
.video-card-duration {
  position: absolute; bottom: 8px; right: 8px;
  background: rgba(0,0,0,0.8);
  padding: 2px 8px; border-radius: 4px;
  font-size: 11px; font-weight: 600;
}
.video-card-info { padding: 14px; }
.video-card-title {
  font-size: 14px; font-weight: 600; margin-bottom: 6px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.video-card-stats { font-size: 11px; color: var(--text-muted); display: flex; gap: 12px; }
.video-card-stats span { display: flex; align-items: center; gap: 4px; }

/* ===== Promotion ===== */
.promo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 32px; }
.promo-card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  padding: 28px; transition: var(--transition);
}
.promo-card:hover { border-color: var(--border-gold); }
.promo-card-title { font-size: 16px; font-weight: 700; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
.promo-card-title i { color: var(--accent-gold); }
.promo-link-box {
  display: flex; align-items: center; gap: 12px;
  background: var(--bg-input);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  padding: 12px 16px; margin-bottom: 12px;
}
.promo-link-box input { flex: 1; background: none; border: none; outline: none; color: var(--text-secondary); font-size: 12px; font-family: inherit; }
.promo-link-box button {
  background: var(--accent-gradient);
  color: #0a0a18; border: none; border-radius: 6px;
  padding: 6px 14px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit;
}
.promo-qr {
  width: 140px; height: 140px; margin: 16px auto;
  background: white; border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center; padding: 8px;
}
.promo-qr-inner {
  width: 100%; height: 100%;
  background: repeating-conic-gradient(#333 0% 25%, #fff 0% 50%) 50% / 12px 12px;
  border-radius: 4px;
}
.promo-qr-text { text-align: center; font-size: 12px; color: var(--text-muted); margin-top: 8px; }
.stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
.stat-card { background: var(--bg-input); border-radius: var(--radius-sm); padding: 18px; text-align: center; }
.stat-value {
  font-size: 28px; font-weight: 800;
  background: var(--accent-gradient);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.stat-label { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
.promo-rules { margin-top: 20px; }
.promo-rules h3 { font-size: 16px; font-weight: 700; margin-bottom: 16px; }
.rule-item { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border-color); }
.rule-num {
  width: 24px; height: 24px; min-width: 24px; border-radius: 50%;
  background: var(--accent-gradient);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; color: #0a0a18;
}
.rule-text { font-size: 13px; color: var(--text-secondary); line-height: 1.5; }

/* ===== VIP ===== */
.vip-hero {
  background: linear-gradient(135deg, #2a1a00 0%, #1a1a2e 40%, #0f0f2a 100%);
  border: 1px solid rgba(240,192,64,0.2);
  border-radius: var(--radius-lg);
  padding: 48px; margin-bottom: 32px;
  position: relative; overflow: hidden;
}
.vip-hero::before {
  content: ''; position: absolute; top: -50%; right: -10%;
  width: 400px; height: 400px;
  background: radial-gradient(circle, rgba(240,192,64,0.1) 0%, transparent 70%);
  pointer-events: none;
}
.vip-crown { font-size: 48px; margin-bottom: 16px; }
.vip-hero h2 {
  font-size: 32px; font-weight: 800;
  background: var(--accent-gradient);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  margin-bottom: 12px; position: relative;
}
.vip-hero p { color: var(--text-secondary); font-size: 15px; max-width: 500px; position: relative; }
.vip-plans { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 36px; }
.vip-plan {
  background: var(--bg-card); border: 1px solid var(--border-color);
  border-radius: var(--radius-lg); padding: 32px 24px;
  text-align: center; transition: var(--transition);
  position: relative; overflow: hidden; cursor: pointer;
}
.vip-plan:hover { border-color: var(--border-gold); transform: translateY(-4px); box-shadow: var(--shadow-glow); }
.vip-plan.popular { border-color: var(--accent-gold); background: linear-gradient(to bottom, rgba(240,192,64,0.08), var(--bg-card)); }
.vip-plan.popular::before {
  content: '推荐'; position: absolute; top: 16px; right: -28px;
  background: var(--accent-gradient); color: #0a0a18;
  padding: 4px 36px; font-size: 11px; font-weight: 700; transform: rotate(45deg);
}
.vip-plan-icon { font-size: 36px; margin-bottom: 16px; }
.vip-plan-name { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
.vip-plan-price {
  font-size: 36px; font-weight: 800;
  background: var(--accent-gradient);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  margin-bottom: 4px;
}
.vip-plan-price span { font-size: 14px; }
.vip-plan-original { font-size: 14px; color: var(--text-muted); text-decoration: line-through; margin-bottom: 20px; }
.vip-plan-btn {
  display: block; width: 100%; padding: 12px; border-radius: var(--radius-sm);
  border: 1px solid var(--border-color); background: transparent;
  color: var(--text-primary); font-size: 14px; font-weight: 600;
  cursor: pointer; transition: var(--transition); font-family: inherit;
}
.vip-plan.popular .vip-plan-btn {
  background: var(--accent-gradient); color: #0a0a18;
  border-color: transparent; box-shadow: 0 4px 20px rgba(240,192,64,0.3);
}
.vip-plan-btn:hover { border-color: var(--accent-gold); }
.vip-privileges {
  background: var(--bg-card); border: 1px solid var(--border-color);
  border-radius: var(--radius-lg); padding: 32px;
}
.vip-privileges h3 { font-size: 20px; font-weight: 700; margin-bottom: 24px; }
.priv-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
.priv-item { text-align: center; padding: 20px 12px; }
.priv-item i { font-size: 28px; color: var(--accent-gold); margin-bottom: 12px; display: block; }
.priv-item h4 { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
.priv-item p { font-size: 11px; color: var(--text-muted); line-height: 1.5; }

/* ===== Activity ===== */
.activity-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
.activity-card {
  background: var(--bg-card); border: 1px solid var(--border-color);
  border-radius: var(--radius-lg); overflow: hidden;
  transition: var(--transition); cursor: pointer;
}
.activity-card:hover { border-color: var(--border-gold); transform: translateY(-2px); box-shadow: var(--shadow-card); }
.activity-card-banner { height: 140px; position: relative; overflow: hidden; }
.activity-card-banner img { width: 100%; height: 100%; object-fit: cover; }
.activity-status {
  position: absolute; top: 12px; right: 12px;
  padding: 4px 12px; border-radius: 20px;
  font-size: 11px; font-weight: 700;
}
.activity-status.active { background: rgba(39,174,96,0.9); color: white; }
.activity-status.upcoming { background: var(--accent-gold); color: #0a0a18; }
.activity-status.ended { background: rgba(255,255,255,0.2); color: var(--text-secondary); }
.activity-card-body { padding: 20px; }
.activity-card-body h3 { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
.activity-card-body p { font-size: 12px; color: var(--text-muted); line-height: 1.6; margin-bottom: 12px; }
.activity-card-footer { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--text-muted); }

/* ===== Help ===== */
.faq-categories { display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; }
.faq-cat {
  padding: 8px 18px; border-radius: 20px; font-size: 13px; font-weight: 500;
  cursor: pointer; transition: var(--transition);
  background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-secondary);
}
.faq-cat.active, .faq-cat:hover { background: var(--accent-gradient); color: #0a0a18; border-color: transparent; }
.faq-list { max-width: 800px; }
.faq-item {
  background: var(--bg-card); border: 1px solid var(--border-color);
  border-radius: var(--radius-sm); margin-bottom: 10px; overflow: hidden;
}
.faq-question {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px; cursor: pointer;
  font-size: 14px; font-weight: 500; transition: var(--transition);
}
.faq-question:hover { background: rgba(255,255,255,0.02); }
.faq-question i { color: var(--text-muted); font-size: 12px; transition: var(--transition); }
.faq-item.open .faq-question i { transform: rotate(180deg); color: var(--accent-gold); }
.faq-answer { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; }
.faq-item.open .faq-answer { max-height: 300px; }
.faq-answer-content { padding: 0 20px 16px; font-size: 13px; color: var(--text-secondary); line-height: 1.8; }

/* ===== Asset ===== */
.asset-overview { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 28px; }
.asset-card {
  background: var(--bg-card); border: 1px solid var(--border-color);
  border-radius: var(--radius); padding: 24px; transition: var(--transition);
}
.asset-card:hover { border-color: var(--border-gold); }
.asset-card-label { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
.asset-card-value { font-size: 28px; font-weight: 800; margin-bottom: 4px; }
.asset-card-sub { font-size: 12px; color: var(--text-muted); }
.asset-actions { display: flex; gap: 12px; margin-bottom: 28px; }
.btn-deposit, .btn-withdraw {
  padding: 12px 32px; border-radius: var(--radius-sm);
  font-size: 14px; font-weight: 600; cursor: pointer;
  transition: var(--transition); border: none; font-family: inherit;
  display: flex; align-items: center; gap: 8px;
}
.btn-deposit { background: var(--accent-gradient); color: #0a0a18; box-shadow: 0 4px 20px rgba(240,192,64,0.3); }
.btn-deposit:hover { transform: translateY(-2px); box-shadow: 0 6px 30px rgba(240,192,64,0.4); }
.btn-withdraw { background: transparent; color: var(--text-primary); border: 1px solid var(--border-color); }
.btn-withdraw:hover { border-color: var(--accent-gold); }
.asset-table { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius); overflow: hidden; }
.asset-table-header {
  padding: 18px 24px; border-bottom: 1px solid var(--border-color);
  display: flex; justify-content: space-between; align-items: center;
}
.asset-table-header h3 { font-size: 16px; font-weight: 700; }
.asset-table table { width: 100%; border-collapse: collapse; }
.asset-table th {
  text-align: left; padding: 14px 24px; font-size: 11px; font-weight: 600;
  color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px;
  border-bottom: 1px solid var(--border-color);
}
.asset-table td { padding: 16px 24px; font-size: 13px; border-bottom: 1px solid var(--border-color); }
.asset-table tr:last-child td { border-bottom: none; }
.coin-name { font-weight: 600; }
.coin-full { font-size: 11px; color: var(--text-muted); }
.amount { font-weight: 600; font-family: 'SF Mono', 'Courier New', monospace; }
.tx-type-deposit { color: #2ecc71; }
.tx-type-withdraw { color: #e74c3c; }
.tx-status { font-size: 11px; padding: 3px 10px; border-radius: 12px; font-weight: 600; }
.tx-status.completed { background: rgba(46,204,113,0.15); color: #2ecc71; }
.tx-status.pending { background: rgba(240,192,64,0.15); color: var(--accent-gold); }

/* ===== Profile ===== */
.profile-header {
  display: flex; align-items: center; gap: 24px;
  background: var(--bg-card); border: 1px solid var(--border-color);
  border-radius: var(--radius-lg); padding: 32px; margin-bottom: 28px;
}
.profile-avatar {
  width: 80px; height: 80px; border-radius: 50%;
  background: var(--accent-gradient);
  display: flex; align-items: center; justify-content: center;
  font-size: 32px; font-weight: 800; color: #0a0a18;
  box-shadow: 0 0 30px rgba(240,192,64,0.2);
}
.profile-info h2 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
.profile-info .profile-id { font-size: 13px; color: var(--text-muted); margin-bottom: 8px; }
.profile-vip-badge {
  display: inline-flex; align-items: center; gap: 6px;
  background: linear-gradient(135deg, rgba(240,192,64,0.15), rgba(230,126,34,0.15));
  border: 1px solid var(--border-gold);
  padding: 4px 14px; border-radius: 20px;
  font-size: 12px; font-weight: 600; color: var(--accent-gold);
}
.profile-stats {
  display: flex; gap: 40px; margin-left: auto;
}
.profile-stat { text-align: center; }
.profile-stat .value { font-size: 20px; font-weight: 700; }
.profile-stat .label { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
